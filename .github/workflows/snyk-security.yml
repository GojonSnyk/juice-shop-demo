
name: Snyk Security Scans

on:
  push:
    branches:
      - test-branch
  pull_request:
    branches:
      - test-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-security:
    name: Snyk Security Analysis
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: |
          npm install --ignore-scripts
          npm --prefix frontend install --ignore-scripts

      - name: Install Snyk CLI
        run: npm install --global snyk@1.1308.3

      - name: Authenticate Snyk
        run: snyk auth

      # OPEN SOURCE
      - name: Snyk Open Source Test
        continue-on-error: true
        run: snyk test --all-projects --org=amti_christian

      - name: Upload Open Source results to Snyk
        run: snyk monitor --all-projects --org=amti_christian --target-reference="${GITHUB_REF_NAME}"

      # CODE
      - name: Snyk Code Scan and Report
        continue-on-error: true
        run: |
          snyk code test --org=amti_christian --report --project-name="juice-shop-demo-code" --target-name="juice-shop-demo" --target-reference="${GITHUB_REF_NAME}"

      # SECRETS
      - name: Snyk Secrets Scan and Report
        continue-on-error: true
        run: |
          snyk secrets test --org=amti_christian --report --target-name="juice-shop-demo-secrets" --target-reference="${GITHUB_REF_NAME}"

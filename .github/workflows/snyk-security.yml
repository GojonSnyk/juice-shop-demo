
name: Snyk Security Analysis

on:
  push:
    branches:
      - test-branch
  pull_request:
    branches:
      - test-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-code-and-secrets:
    name: Snyk Code and Secrets
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          
      - name: Install Snyk CLI
        run: |
          npm install --global snyk@1.1308.3

      - name: Snyk Code Scan and Dashboard Report
        continue-on-error: true
        run: |
          snyk code test \
            --org=amti_christian \
            --report \
            --project-name="Juice Shop Demo - Code" \
            --target-name="Juice Shop Demo" \
            --target-reference="${GITHUB_REF_NAME}"

      - name: Snyk Secrets Scan
        continue-on-error: true
        run: |
          snyk secrets test --org=amti_christian

  snyk-open-source:
    name: Snyk Open Source
    runs-on: ubuntu-latest

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_API: ${{ secrets.SNYK_API }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install matching npm version
        run: npm install --global npm@11.19.1

      - name: Install root dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install frontend dependencies
        run: npm --prefix frontend install --legacy-peer-deps --ignore-scripts

      - name: Install Snyk CLI
        run: npm install --global snyk@1.1308.3

      - name: Test Open Source dependencies
        continue-on-error: true
        run: |
          snyk test --all-projects --org=amti_christian

      - name: Upload root dependencies to Snyk
        run: |
          snyk monitor \
            --file=package.json \
            --org=amti_christian \
            --project-name="Juice Shop Demo - Open Source - Root" \
            --target-reference="${GITHUB_REF_NAME}"

      - name: Upload frontend dependencies to Snyk
        run: |
          snyk monitor \
            --file=frontend/package.json \
            --org=amti_christian \
            --project-name="Juice Shop Demo - Open Source - Frontend" \
            --target-reference="${GITHUB_REF_NAME}"
